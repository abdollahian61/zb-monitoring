# Merge into the existing configuration; do not replace the whole HAProxy file.
# In the existing HTTPS frontend (TLS certificate stays in the existing bind):
# acl host_zabbix hdr(host) -i zabbix.iraneit.app
# use_backend zabbix_web if host_zabbix

backend zabbix_web
    mode http
    balance roundrobin
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    cookie ZBXNODE insert indirect nocache secure httponly
    option httpchk
    http-check send meth GET uri /index.php ver HTTP/1.1 hdr Host zabbix.iraneit.app
    http-check expect status 200-399
    server zbx_b REPLACE_B_IP:8080 check inter 3s fall 3 rise 2 cookie b
    server zbx_c REPLACE_C_IP:8080 check inter 3s fall 3 rise 2 cookie c
