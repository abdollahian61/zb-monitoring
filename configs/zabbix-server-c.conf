# baseline for 50 directly monitored hosts; tune after measuring NVPS
LogFile=/var/log/zabbix/zabbix_server.log
LogFileSize=100
PidFile=/run/zabbix/zabbix_server.pid
SocketDir=/run/zabbix
DBHost=192.168.42.4
DBName=zabbix
DBUser=zabbix
DBPassword=REPLACE_DB_PASSWORD
DBPort=3306
ListenPort=10051
CacheSize=512M
HistoryCacheSize=256M
HistoryIndexCacheSize=128M
TrendCacheSize=128M
ValueCacheSize=512M
StartPollers=5
StartAgentPollers=2
StartSNMPPollers=2
StartHTTPAgentPollers=2
MaxConcurrentChecksPerPoller=100
StartPollersUnreachable=2
StartHTTPPollers=4
StartTrappers=8
StartPingers=2
StartPreprocessors=8
StartDBSyncers=4
StartDiscoverers=1
Timeout=5
HousekeepingFrequency=1
MaxHousekeeperDelete=5000
ExternalScripts=/usr/lib/zabbix/externalscripts
FpingLocation=/usr/bin/fping
HANodeName=EIT-ZBX-HA
NodeAddress=192.168.42.3:10051
